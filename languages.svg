<svg xmlns="http://www.w3.org/2000/svg" width="350" height="210" viewBox="0 0 350 210" role="img" aria-label="Most Used Languages">
<title>Most Used Languages</title>
<style>
  .t { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #34D399; }
  .l { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E6EDF3; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E6EDF3; }
  .m { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8B949E; }
