<svg xmlns="http://www.w3.org/2000/svg" width="415" height="330" viewBox="0 0 415 330" role="img" aria-label="AI-Powered FAQ Chatbot">
<title>AI-Powered FAQ Chatbot</title>
<style>
  .h { font: 700 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E6EDF3; }
  .s { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8B949E; }
  .bt { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #34D399; }
  .li { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E6EDF3; }
  .chip { font: 600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #34D399; }
  .pill { font: 700 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #fff; letter-spacing: .6px; }
  .cta { font: 700 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #34D399; }
  .in { opacity: 0; animation: in .6s ease-out forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#064E3B"/><stop offset=".5" stop-color="#059669"/><stop offset="1" stop-color="#34D399"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#10B981" stop-opacity=".18"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect x=".5" y=".5" width="414" height="329" rx="14"/></clipPath>
</defs>
<rect x=".5" y=".5" width="414" height="329" rx="14" fill="#0D1117" stroke="#1F6F4A"/>
<g clip-path="url(#card)"><rect width="415" height="330" fill="url(#glow)"/><rect width="415" height="5" fill="url(#g)"/></g>
<text x="24" y="50" class="h" style="font-size:19px">💬  AI-Powered FAQ Chatbot</text><rect x="24.0" y="66" width="88.0" height="24" rx="12" fill="#10B981"/><circle cx="37.0" cy="78" r="3.5" fill="#fff"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="47.0" y="82.5" class="pill">COMPLETE</text><text x="24" y="118" class="s">Knowledge-base chatbot that answers</text><text x="24" y="138" class="s">from company data instead of guessing.</text><g class="in" style="animation-delay:0.10s"><path d="M24 172 l4 4 l8 -9" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="176.5" class="li">Retrieval-augmented generation</text></g><g class="in" style="animation-delay:0.20s"><path d="M24 196 l4 4 l8 -9" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="200.5" class="li">Structured system prompts</text></g><g class="in" style="animation-delay:0.30s"><path d="M24 220 l4 4 l8 -9" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="224.5" class="li">Grounded, source-based answers</text></g><g class="in" style="animation-delay:0.40s"><path d="M24 244 l4 4 l8 -9" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="248.5" class="li">Easy knowledge-base updates</text></g><line x1="24" y1="266" x2="391" y2="266" stroke="#1B3B2D"/><rect x="24.0" y="284" width="88.0" height="24" rx="12" fill="#0F2A1F" stroke="#1F6F4A"/><text x="68.0" y="300.5" text-anchor="middle" class="chip">Claude API</text><rect x="120.0" y="284" width="37.6" height="24" rx="12" fill="#0F2A1F" stroke="#1F6F4A"/><text x="138.8" y="300.5" text-anchor="middle" class="chip">RAG</text><rect x="165.6" y="284" width="109.6" height="24" rx="12" fill="#0F2A1F" stroke="#1F6F4A"/><text x="220.4" y="300.5" text-anchor="middle" class="chip">Prompt design</text>
</svg>
